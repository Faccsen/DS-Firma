<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Phaenatics e.V. — Cannabis Social Club in Lüneburg">
  <defs>
    <path id="phaen-ring" d="M 110,110 m -92,0 a 92,92 0 1,1 184,0 a 92,92 0 1,1 -184,0" fill="none"/>
    <g id="phaen-leaf">
      <!-- 7-leaflet stylised cannabis fan leaf, pointing up, stem at origin -->
      <path d="M 0,0 Q -2,-12 -3,-28 Q -4,-50 -2,-72 Q 0,-92 0,-100 Q 0,-92 2,-72 Q 4,-50 3,-28 Q 2,-12 0,0 Z"/>
      <path d="M 0,0 Q -2,-10 -3,-22 Q -4,-38 -2,-55 Q 0,-72 0,-78 Q 0,-72 2,-55 Q 4,-38 3,-22 Q 2,-10 0,0 Z" transform="rotate(32)"/>
      <path d="M 0,0 Q -2,-10 -3,-22 Q -4,-38 -2,-55 Q 0,-72 0,-78 Q 0,-72 2,-55 Q 4,-38 3,-22 Q 2,-10 0,0 Z" transform="rotate(-32)"/>
      <path d="M 0,0 Q -2,-8 -2,-16 Q -3,-28 -2,-40 Q 0,-54 0,-58 Q 0,-54 2,-40 Q 3,-28 2,-16 Q 2,-8 0,0 Z" transform="rotate(58)"/>
      <path d="M 0,0 Q -2,-8 -2,-16 Q -3,-28 -2,-40 Q 0,-54 0,-58 Q 0,-54 2,-40 Q 3,-28 2,-16 Q 2,-8 0,0 Z" transform="rotate(-58)"/>
      <path d="M 0,0 Q -1,-5 -2,-11 Q -2,-19 -1,-27 Q 0,-35 0,-38 Q 0,-35 1,-27 Q 2,-19 2,-11 Q 1,-5 0,0 Z" transform="rotate(82)"/>
      <path d="M 0,0 Q -1,-5 -2,-11 Q -2,-19 -1,-27 Q 0,-35 0,-38 Q 0,-35 1,-27 Q 2,-19 2,-11 Q 1,-5 0,0 Z" transform="rotate(-82)"/>
    </g>
  </defs>

  <!-- cream disc -->
  <circle cx="110" cy="110" r="62" fill="#f2e8d0"/>

  <!-- text ring (outside the disc) -->
  <text fill="#f2e8d0" style="font-family: 'Fraunces','Playfair Display',serif; font-size:9.5px; font-weight:500; letter-spacing:2.8px;">
    <textPath href="#phaen-ring" startOffset="0">
       · PHAENATICS E.V. · PROFESSIONELLER CANNABIS SOCIAL CLUB IN LÜNEBURG
    </textPath>
  </text>

  <!-- two overlapping leaves on the disc -->
  <use href="#phaen-leaf" fill="#17402f" transform="translate(104,116) rotate(-30) scale(0.5)"/>
  <use href="#phaen-leaf" fill="#17402f" transform="translate(116,104) rotate(150) scale(0.5)"/>
</svg>
